name: HAPI OS Master CI and Launcher Readiness

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hapi-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-conformance:
    name: Canonical conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate constitutional and canonical law
        run: node scripts/validate-canon-law.mjs

      - name: Validate ecosystem kernel
        run: node scripts/validate-kernel.mjs

      - name: Validate ecosystem overview
        run: node scripts/validate-ecosystem-overview.mjs

      - name: Validate all product recipes
        run: node scripts/compose-product-recipe.mjs --validate-all

      - name: Validate global build readiness contracts
        run: node scripts/verify-global-build-readiness.mjs

      - name: Run complete Node.js test suite
        run: node --test

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  launcher-target-readiness:
    name: Launcher target readiness inventory
    needs: canonical-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Publish verified platform implementation inventory
        shell: bash
        run: |
          has_file() {
            find . -type f -not -path './.git/*' -name "$1" -print -quit | grep -q .
          }

          has_dir() {
            find . -type d -not -path './.git/*' -name "$1" -print -quit | grep -q .
          }

          {
            echo "## HAPI OS launcher target readiness"
            echo
            echo "| Target or component | Evidence in this repository | Status |"
            echo "|---|---|---|"
            echo "| Linux / macOS / Windows | Canonical validators and tests run on all three CI runners | CI conformance only; no launcher binaries |"

            if has_file Cargo.toml; then echo "| Rust workspace | Cargo.toml found | PRESENT |"; else echo "| Rust workspace | No Cargo.toml found | NOT PRESENT |"; fi
            if has_file tauri.conf.json || has_file tauri.conf.json5; then echo "| Tauri shell | Tauri configuration found | PRESENT |"; else echo "| Tauri shell | No Tauri configuration found | NOT PRESENT |"; fi
            if has_file gradlew || has_file build.gradle || has_file build.gradle.kts; then echo "| Android Gradle project | Gradle project files found | PRESENT |"; else echo "| Android Gradle project | No Gradle project files found | NOT PRESENT |"; fi
            if has_dir '*.xcodeproj' || has_dir '*.xcworkspace'; then echo "| Apple Xcode project | Xcode project/workspace found | PRESENT |"; else echo "| Apple Xcode project | No Xcode project/workspace found | NOT PRESENT |"; fi
            if has_file uef_shm_ring.c; then echo "| C11 shared-memory ring buffer | C source filename found | PRESENT — inspect path and tests |"; else echo "| C11 shared-memory ring buffer | No uef_shm_ring.c found | NOT PRESENT |"; fi
            if find . -type f -not -path './.git/*' \( -iname '*hcpql*.rs' -o -iname '*hcpql*.c' -o -iname '*hcpql*.cpp' -o -iname '*hcpql*.ts' -o -iname '*hcpql*.js' \) -print -quit | grep -q .; then echo "| HCPQL implementation source | Matching source file found | PRESENT — verify implementation separately |"; else echo "| HCPQL implementation source | No matching source file found | NOT PRESENT |"; fi

            echo
            echo "This inventory scans only carbonactual/carbonactual. It does not build the private ABBA or platform-runtime repositories."
            echo
            echo "No release, signing, publishing, or production deployment is performed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
