name: Canonical Conformance

on:
  push:
    paths:
      - 'architecture/canonical/**'
      - 'supabase/migrations/**'
      - 'tests/architecture/canonical-contract.test.mjs'
      - '.github/workflows/canonical-conformance.yml'
  pull_request:
    paths:
      - 'architecture/canonical/**'
      - 'supabase/migrations/**'
      - 'tests/architecture/canonical-contract.test.mjs'
      - '.github/workflows/canonical-conformance.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run canonical repository validator
        run: node scripts/validate-kernel.mjs
      - name: Run Phase 0/1 contract tests
        run: node --test tests/architecture/canonical-contract.test.mjs
