name: Ecosystem Kernel Conformance

on:
  push:
    paths:
      - 'README.md'
      - 'architecture/ecosystem-kernel.json'
      - 'architecture/kernel-repo-contract.json'
      - 'architecture/product-projection-registry.json'
      - 'architecture/repository-estate-registry.json'
      - 'architecture/CARBON_ACTUAL_LEGACY_ARCHITECTURE_CROSSWALK.json'
      - 'architecture/ECOSYSTEM_KERNEL.md'
      - 'architecture/LEGACY_OMNII_MIGRATION_REGISTRY.json'
      - 'architecture/CARBON_ACTUAL_*.md'
      - 'architecture/CARBON_ACTUAL_COMMUNICATION_PRESENCE_REGISTRY.json'
      - 'architecture/SPOTIST_*.md'
      - 'scripts/validate-kernel.mjs'
      - 'tests/architecture/ecosystem-kernel.test.mjs'
      - 'docs/superpowers/specs/2026-09-17-carbon-actual-operating-spine.md'
      - 'docs/superpowers/plans/2026-09-17-carbon-actual-operating-spine.md'
      - 'docs/verification/**'
      - '.github/workflows/ecosystem-kernel.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'architecture/ecosystem-kernel.json'
      - 'architecture/kernel-repo-contract.json'
      - 'architecture/product-projection-registry.json'
      - 'architecture/repository-estate-registry.json'
      - 'architecture/CARBON_ACTUAL_LEGACY_ARCHITECTURE_CROSSWALK.json'
      - 'architecture/ECOSYSTEM_KERNEL.md'
      - 'architecture/LEGACY_OMNII_MIGRATION_REGISTRY.json'
      - 'architecture/CARBON_ACTUAL_*.md'
      - 'architecture/CARBON_ACTUAL_COMMUNICATION_PRESENCE_REGISTRY.json'
      - 'architecture/SPOTIST_*.md'
      - 'scripts/validate-kernel.mjs'
      - 'tests/architecture/ecosystem-kernel.test.mjs'
      - 'docs/superpowers/specs/2026-09-17-carbon-actual-operating-spine.md'
      - 'docs/superpowers/plans/2026-09-17-carbon-actual-operating-spine.md'
      - 'docs/verification/**'
      - '.github/workflows/ecosystem-kernel.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate kernel
        run: node scripts/validate-kernel.mjs
      - name: Run kernel tests
        run: node --test tests/architecture/ecosystem-kernel.test.mjs
